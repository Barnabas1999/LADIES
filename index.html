<script type="text/babel">
const { useState, useEffect } = React;
const supabase = window.supabase.createClient('https://lmlivfvwhjkfxiukdrlm.supabase.co','sb_publishable_8Lhp0kpFsJM6Wrq_ZxKwgQ_YDrxBUaE');
const CATS=["tablets","iPad","phone screen","Home appliances screen","Electronic devices screen","Fashion men screen","Women fashion screen","Kids screen","Medical equipment screen","Electrical power screen","Customatic screen","Car,bike,bicycles screen","Engineering equipment screen","Kitchen screen","Food delivery screen","Food & groceries screen"];

function App(){
  const [products,setProducts]=useState([]);
  const [cart,setCart]=useState([]);
  const [wallet,setWallet]=useState(500);
  const [user,setUser]=useState(null);
  const [modal,setModal]=useState(null);
  const [detail,setDetail]=useState(null);
  const [detailQty,setDetailQty]=useState(1);
  const [detailImg,setDetailImg]=useState('');
  const [theme,setTheme]=useState('greenBlackGold');
  const [chat,setChat]=useState([{from:'bot',text:'👋 Welcome to GREEN STORE AFRICA! I am GS Africa Smart Robot - I know YOUR wallet, cart, products. Ask: What should I buy in Africa with my wallet?'}]);
  const [chatInput,setChatInput]=useState('');
  const [search,setSearch]=useState('');
  const [auth,setAuth]=useState({email:'',password:'',msg:''});
  const [fund,setFund]=useState({amount:'',ref:''});
  const [orderForm,setOrderForm]=useState({fullName:'',phone:'',email:'',addr:'',city:'',state:'',country:'',zip:'',note:''});

  useEffect(()=>{
    const saved=localStorage.getItem('gs_theme')||'greenBlackGold';
    applyTheme(saved);
    loadProducts();
    supabase.auth.getUser().then(({data})=>{if(data.user){setUser(data.user); supabase.from('wallets').select('balance').eq('user_id',data.user.id).single().then(({data})=>{if(data)setWallet(data.balance)})}});
  },[]);

  function applyTheme(t){
    setTheme(t); localStorage.setItem('gs_theme',t);
    const r=document.documentElement;
    const themes={
      blackGold:{bg:'#050a06',card:'#0f1a12',gold:'#C6A86F',green:'#C6A86F',text:'#fff',border:'#1e3322',input:'#09110a'},
      greenBlackGold:{bg:'#060d07',card:'#0c1f0f',gold:'#C6A86F',green:'#22c55e',text:'#fff',border:'#1a3d1f',input:'#0a1a0c'},
      whiteGold:{bg:'#fff',card:'#fff9ec',gold:'#C6A86F',green:'#C6A86F',text:'#111',border:'#e8d9b5',input:'#fffaf0'},
      blackGreen:{bg:'#040a05',card:'#0a1a0f',gold:'#22c55e',green:'#22c55e',text:'#fff',border:'#143d1f',input:'#08120a'},
      lightGreen:{bg:'#f1f8f1',card:'#fff',gold:'#22c55e',green:'#22c55e',text:'#0a1a0f',border:'#b7e4b7',input:'#e8f5e9'},
      lightGreenGold:{bg:'#f8fdf8',card:'#fff',gold:'#C6A86F',green:'#22c55e',text:'#0a1a0f',border:'#c8e6c9',input:'#f1f8e9'}
    };
    const th=themes[t]; if(th) Object.entries(th).forEach(([k,v])=>r.style.setProperty(`--${k}`,v));
  }

  async function loadProducts(cat=''){
    let q=supabase.from('products').select('*').order('created_at',{ascending:false}).limit(100);
    if(cat) q=q.ilike('category',`%${cat}%`);
    const {data}=await q; setProducts(data||[]);
  }

  function addToCart(p,qty=1){
    setCart(prev=>{
      const i=prev.findIndex(c=>c.name===p.name);
      if(i>-1){const copy=[...prev]; copy[i].qty+=qty; return copy;}
      return [...prev,{name:p.name,price:+p.price,qty,image:p.image?.split(',')[0]}];
    });
    setModal('cart');
  }

  const total=cart.reduce((s,i)=>s+i.price*i.qty,0);
  const count=cart.reduce((s,i)=>s+i.qty,0);
  const filtered=products.filter(p=>p.name.toLowerCase().includes(search.toLowerCase()));

  function askRobot(q){
    if(!q) return;
    const qLower=q.toLowerCase();
    let ans='';
    if(qLower.includes('what should i buy')||qLower.includes('recommend')){
      const affordable=products.filter(p=>p.price<=wallet).slice(0,3);
      ans=affordable.length?`🎁 GREEN STORE AFRICA recommends with #${wallet.toLocaleString()}: ${affordable.map(p=>`${p.name} #${Number(p.price).toLocaleString()}`).join(', ')} — Tap product to see Africa delivery details + more images!`:`💡 Wallet #${wallet.toLocaleString()} low. Fund PalmPay 9122857147 for Africa delivery`;
    }else if(qLower.includes('wallet')||qLower.includes('fund')){
      ans=`💰 GS AFRICA Wallet #${wallet.toLocaleString()} | Cart #${total.toLocaleString()} | ${total>wallet?`Need #${(total-wallet).toLocaleString()} more - Fund 9122857147 for GS-AFRICA waybill`:'✅ Ready to pay & ship all Africa!'}`;
    }else if(qLower.includes('cart')){
      ans=`🛒 GS AFRICA Cart ${count} items #${total.toLocaleString()} | ${cart.map(c=>c.name+' x'+c.qty).join(', ')||'Empty - Tap product for details + more images gallery'}`;
    }else if(qLower.includes('africa')||qLower.includes('delivery')){
      ans=`🌍 GREEN STORE AFRICA delivers to Nigeria, Ghana, Kenya, South Africa, all Africa! Wallet pay, GS-AFRICA waybill tracking, rider delivery. From Port Harcourt, Rivers State.`;
    }else{
      ans=`🤖 GREEN STORE AFRICA Robot: Wallet #${wallet.toLocaleString()}, Cart ${count} items, Products ${products.length}. GS delivers all Africa, wallet only, tap product for details + more images. Ask "What should I buy in Africa?"`;
    }
    setChat(prev=>[...prev,{from:'user',text:q},{from:'bot',text:ans}]);
  }

  return(
    <div>
      <header>
        <div style={{display:'flex',alignItems:'center',gap:6}}><div style={{width:32,height:32,borderRadius:'50%',background:'conic-gradient(#C6A86F,#22c55e,#C6A86F)',display:'flex',alignItems:'center',justifyContent:'center',color:'#000',fontFamily:'Orbitron',fontWeight:900,fontSize:10}}>GS</div><div><b style={{fontSize:11}}>GREEN STORE AFRICA</b><div style={{fontSize:7,color:'var(--green)'}}>ALL AFRICA DELIVERY</div></div></div>
        <input className="search" placeholder="Search Africa products..." value={search} onChange={e=>setSearch(e.target.value)} />
        <button className="btn btn-dark" onClick={()=>setModal('wallet')}>Wallet #{wallet}</button>
        <button className="btn btn-gold" onClick={()=>setModal('cart')}><i className="ri-shopping-cart-line"></i> {count}</button>
        <button className="btn btn-dark" onClick={()=>setModal('auth')}>{user?user.email.slice(0,8):'Login'}</button>
      </header>

      <div style={{padding:'8px 3%',background:'var(--card)',borderBottom:'1px solid var(--border)',textAlign:'center'}}>
        <h1 style={{fontSize:14,fontFamily:'Orbitron',color:'var(--gold)'}}>GREEN STORE AFRICA - AFRICA'S ONLINE SHOPPING MALL</h1>
        <p style={{fontSize:9,color:'#6a8a70'}}>Port Harcourt, Nigeria | Ghana | Kenya | South Africa | All Africa Delivery | Wallet Pay | GS-AFRICA Waybill</p>
      </div>

      <div className="grid-cats">{CATS.map(c=><div key={c} className="cat" onClick={()=>loadProducts(c)}>{c}</div>)}</div>
      <div className="products">
        {filtered.map((p,idx)=>(
          <div key={p.id||idx} className="card" onClick={()=>{setDetail(p); setDetailQty(1); setDetailImg(p.image?.split(',')[0]||''); setModal('detail')}}>
            <div className="card-img">{p.image?<img src={p.image.split(',')[0]} alt={p.name} />:<i className="ri-image-line"></i>}</div>
            <div className="card-body"><b style={{fontSize:12}}>{p.name}</b><div style={{fontSize:9,color:'#6a8a70'}}>{p.category} - Africa</div><div className="price">#{Number(p.price).toLocaleString()}</div><button className="btn btn-gold" style={{width:'100%',marginTop:6}} onClick={e=>{e.stopPropagation(); addToCart(p)}}>Add to Cart Africa</button></div>
          </div>
        ))}
      </div>

      <footer style={{padding:'20px 3% 100px',textAlign:'center',borderTop:'1px solid var(--border)',background:'var(--card)'}}>
        <h2 style={{fontFamily:'Orbitron',color:'var(--gold)',fontSize:16}}>GREEN STORE AFRICA</h2>
        <p style={{fontSize:11,marginTop:8,lineHeight:1.6}}>
          <b>Africa's #1 Online Shopping Mall</b><br/>
          Tablets, iPad, Phone Screens, Home Appliances, Electronics, Fashion Men/Women/Kids, Medical Equipment, Electrical Power, Cars/Bikes, Engineering Equipment, Kitchen, Food Delivery<br/><br/>
          <b>Headquarters:</b> Port Harcourt, Rivers State, Nigeria<br/>
          <b>Delivery:</b> Nigeria, Ghana, Kenya, South Africa, All Africa<br/>
          <b>Payment:</b> Wallet Only - PalmPay 9122857147 Barnabas Paul<br/>
          <b>Tracking:</b> GS-AFRICA Waybill + Rider + Pickup Date<br/>
          <b>Contact:</b> barnabaspaul43@gmail.com<br/><br/>
          © 2026 GREEN STORE AFRICA - All Rights Reserved - GS Logo
        </p>
        <div style={{marginTop:12,fontSize:9,color:'#6a8a70'}}>
          Keywords: green store africa, green store Nigeria, online shopping Africa, buy tablets Nigeria, fashion Africa, electronics Africa, GS Africa, Port Harcourt shopping, Africa delivery, wallet pay Africa
        </div>
      </footer>

      <div className="bottom-nav">
        <button className="active" onClick={()=>window.scrollTo({top:0,behavior:'smooth'})}><i className="ri-home-5-fill"></i>Home</button>
        <button onClick={()=>setModal('cats')}><i className="ri-apps-2-line"></i>Cat</button>
        <button onClick={()=>setModal('history')}><i className="ri-file-list-3-line"></i>Orders</button>
        <button onClick={()=>setModal('robot')}><i className="ri-robot-2-fill"></i>Robot</button>
        <button onClick={()=>setModal('settings')}><i className="ri-settings-3-line"></i>Set</button>
      </div>

      {modal==='cart'&&(
        <div className="modal" onClick={e=>{if(e.target===e.currentTarget)setModal(null)}}><div className="modal-box">
          <h3>Cart - {count} items - GS AFRICA</h3>
          <div style={{maxHeight:'40vh',overflow:'auto'}}>{cart.length?cart.map((c,i)=><div key={i} className="cart-item"><div style={{flex:1}}><b>{c.name}</b><br/><span style={{color:'var(--gold)'}}>#{c.price} x {c.qty} = #{c.price*c.qty}</span></div><div style={{display:'flex',gap:4,alignItems:'center'}}><button className="qty-btn" onClick={()=>{const copy=[...cart]; copy[i].qty=Math.max(1,copy[i].qty-1); setCart(copy)}}>-</button><b>{c.qty}</b><button className="qty-btn" onClick={()=>{const copy=[...cart]; copy[i].qty++; setCart(copy)}}>+</button><button style={{background:'#ff4444',border:'none',borderRadius:'50%',width:28,height:28,color:'#fff'}} onClick={()=>setCart(cart.filter((_,idx)=>idx!==i))}>X</button></div></div>):<p style={{textAlign:'center',padding:20,color:'#6a8a70'}}>Cart empty - Tap product for Africa details</p>}</div>
          <div style={{border:'2px solid var(--gold)',borderRadius:12,padding:10,marginTop:10,display:'flex',justifyContent:'space-between'}}><div>TOTAL <b style={{color:'var(--gold)'}}>#{total.toLocaleString()}</b><div style={{fontSize:10}}>Wallet #{wallet} - Africa Delivery</div></div><button className="btn btn-dark" onClick={()=>setCart([])}>Clear</button></div>
          <button className="btn btn-gold" style={{width:'100%',marginTop:10,padding:14}} onClick={()=>setModal('checkout')}>ORDER NOW - AFRICA FORM & PAY</button>
          <button className="btn btn-dark" style={{width:'100%',marginTop:6}} onClick={()=>setModal(null)}>Continue Shopping Africa</button>
        </div></div>
      )}

      {modal==='detail'&&detail&&(
        <div className="modal" onClick={e=>{if(e.target===e.currentTarget)setModal(null)}}><div className="modal-box">
          <div style={{display:'flex',justifyContent:'space-between'}}><h3>{detail.name} - GS AFRICA Details</h3><button className="btn btn-dark" onClick={()=>setModal(null)}>X</button></div>
          <div className="detail-main"><img src={detailImg||detail.image?.split(',')[0]} alt={detail.name} /></div>
          <div className="detail-gallery">{detail.image?.split(',').map((im,i)=><div key={i} className={`detail-thumb ${detailImg===im?'active':''}`} onClick={()=>setDetailImg(im)}><img src={im} style={{width:'100%',height:'100%',objectFit:'cover'}} alt={`view ${i+1}`} /></div>)}</div>
          <div style={{background:'var(--input)',border:'1px solid var(--border)',borderRadius:12,padding:10,marginTop:8}}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}><b style={{fontSize:20,color:'var(--gold)'}}>#{Number(detail.price).toLocaleString()}</b><div style={{display:'flex',gap:6,alignItems:'center'}}><button className="qty-btn" onClick={()=>setDetailQty(q=>Math.max(1,q-1))}>-</button><b>{detailQty}</b><button className="qty-btn" onClick={()=>setDetailQty(q=>q+1)}>+</button></div></div>
            <p style={{fontSize:12,marginTop:8,lineHeight:1.5}}>{detail.description||'High quality GREEN STORE AFRICA product. Wallet only payment. GS-AFRICA waybill tracking, rider delivery, pickup date. All Africa delivery from Port Harcourt, Nigeria to Ghana, Kenya, South Africa. More images in gallery above. Tap Add to Cart Africa.'}</p>
            <div style={{display:'flex',gap:8,marginTop:10}}><button className="btn btn-dark" style={{flex:1,padding:12}} onClick={()=>{addToCart(detail,detailQty)}}>Add to Cart Africa</button><button className="btn btn-gold" style={{flex:1,padding:12}} onClick={()=>{addToCart(detail,detailQty); setModal('checkout')}}>Buy Now Africa</button></div>
          </div>
          <button className="btn btn-dark" style={{width:'100%',marginTop:8}} onClick={()=>{setModal('robot'); askRobot(`Tell me about ${detail.name} Africa`)}}>Ask Africa Robot About This</button>
        </div></div>
      )}

      {modal==='checkout'&&(
        <div className="modal"><div className="modal-box"><h3>GREEN STORE AFRICA Order Form - #{total.toLocaleString()}</h3>
          <input placeholder="Full Name *" value={orderForm.fullName} onChange={e=>setOrderForm({...orderForm,fullName:e.target.value})} />
          <input placeholder="Phone *" value={orderForm.phone} onChange={e=>setOrderForm({...orderForm,phone:e.target.value})} />
          <input placeholder="Email *" value={orderForm.email} onChange={e=>setOrderForm({...orderForm,email:e.target.value})} />
          <input placeholder="Street *" value={orderForm.addr} onChange={e=>setOrderForm({...orderForm,addr:e.target.value})} />
          <div style={{display:'flex',gap:6}}><input placeholder="City *" value={orderForm.city} onChange={e=>setOrderForm({...orderForm,city:e.target.value})} style={{flex:1}} /><input placeholder="State *" value={orderForm.state} onChange={e=>setOrderForm({...orderForm,state:e.target.value})} style={{flex:1}} /></div>
          <select value={orderForm.country} onChange={e=>setOrderForm({...orderForm,country:e.target.value})}><option value="">Country * - Africa</option><option>Nigeria</option><option>Ghana</option><option>Kenya</option><option>South Africa</option><option>Other Africa</option></select>
          <button className="btn btn-gold" style={{width:'100%',marginTop:10,padding:14}} onClick={async()=>{
            if(!user) return alert('Login first');
            if(!orderForm.fullName||!orderForm.phone||!orderForm.addr) return alert('Fill required *');
            if(total>wallet) return alert('Low wallet #'+wallet);
            const waybill='GS-AFRICA-'+Math.floor(100000+Math.random()*900000);
            const fullAddr=`${orderForm.fullName} | ${orderForm.phone} | ${orderForm.email} | ${orderForm.addr}, ${orderForm.city}, ${orderForm.state}, ${orderForm.country}`;
            const {error}=await supabase.from('orders').insert({user_id:user.id,products:cart,total,status:'Wallet Paid GS AFRICA',waybill_number:waybill,delivery_address:fullAddr});
            if(error) alert(error.message); else{setWallet(w=>w-total); await supabase.from('wallets').update({balance:wallet-total}).eq('user_id',user.id); setCart([]); alert('PAID! GS AFRICA Waybill '+waybill+' - Africa Delivery!'); setModal(null)}
          }}>CONFIRM & PAY - GS AFRICA WAYBILL</button>
          <button className="btn btn-dark" style={{width:'100%',marginTop:6}} onClick={()=>setModal('cart')}>Back to Cart Africa</button>
        </div></div>
      )}

      {modal==='robot'&&(
        <div className="modal"><div className="modal-box"><h3>GS AFRICA Smart Robot - Knows Your Africa Needs 🤖🌍</h3>
          <div style={{background:'var(--input)',border:'1px solid var(--gold)',borderRadius:10,padding:10,margin:'8px 0',fontSize:11}}>
            {wallet<total?`⚠️ GS AFRICA: Wallet #${wallet} < Cart #${total} - Need #${total-wallet} more. Fund PalmPay 9122857147`:`✅ GS AFRICA: Wallet #${wallet} | Cart ${count} items #${total} | Products ${products.length} | All Africa Delivery`}
          </div>
          <div style={{background:'var(--bg)',border:'1px solid var(--border)',height:300,overflow:'auto',borderRadius:12,padding:10,display:'flex',flexDirection:'column'}}>
            {chat.map((c,i)=><div key={i} className={`chat-bubble ${c.from==='user'?'user-bubble':'bot-bubble'}`}>{c.text}</div>)}
          </div>
          <div style={{display:'flex',gap:6,marginTop:8}}><input style={{flex:1}} placeholder="Ask Africa robot..." value={chatInput} onChange={e=>setChatInput(e.target.value)} onKeyDown={e=>{if(e.key==='Enter'){askRobot(chatInput); setChatInput('')}}} /><button className="btn btn-gold" onClick={()=>{askRobot(chatInput); setChatInput('')}}>Send</button></div>
          <div style={{display:'flex',flexWrap:'wrap',gap:4,marginTop:8}}>
            <button className="btn btn-dark" style={{fontSize:10}} onClick={()=>askRobot('What should I buy in Africa with my wallet?')}>💡 What to buy Africa?</button>
            <button className="btn btn-dark" style={{fontSize:10}} onClick={()=>askRobot('How to fund wallet Africa?')}>💰 Fund Africa?</button>
            <button className="btn btn-dark" style={{fontSize:10}} onClick={()=>askRobot('Africa delivery?')}>🌍 Africa Delivery?</button>
          </div>
          <button className="btn btn-dark" style={{width:'100%',marginTop:8}} onClick={()=>setModal(null)}>Close Africa Robot</button>
        </div></div>
      )}

      {modal==='settings'&&(
        <div className="modal"><div className="modal-box" style={{maxHeight:'90vh',overflow:'auto'}}><h3>Settings - GREEN STORE AFRICA ⚛️🌍</h3>
          <div style={{background:'var(--input)',border:'1px solid var(--border)',borderRadius:12,padding:12,marginTop:10}}><div className="form-title">THEMES - 6 OPTIONS - GS AFRICA</div><div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:8,marginTop:8}}>
            {['blackGold','greenBlackGold','whiteGold','blackGreen','lightGreen','lightGreenGold'].map(t=><div key={t} style={{textAlign:'center'}}><div className={`theme-dot ${theme===t?'active':''}`} style={{background:t==='whiteGold'?'#fff':t==='blackGold'?'#050a06':t==='lightGreen'?'#e8f5e9':'conic-gradient(#060d07,#C6A86F,#22c55e)'}} onClick={()=>applyTheme(t)}></div><div style={{fontSize:8}}>{t}</div></div>)}
          </div></div>
          <div style={{background:'var(--input)',border:'1px solid var(--border)',borderRadius:12,padding:12,marginTop:10}}><div className="form-title">GREEN STORE AFRICA INFO</div>
            <div className="setting-row"><span>Name</span><span>GREEN STORE AFRICA</span></div>
            <div className="setting-row"><span>Library</span><span>React.js 18 Single File</span></div>
            <div className="setting-row"><span>SEO</span><span>Google Optimized ✅</span></div>
            <div className="setting-row"><span>Wallet</span><span>#{wallet}</span></div>
            <div className="setting-row"><span>Cart</span><span>{count} items</span></div>
            <div className="setting-row"><span>Location</span><span>Port Harcourt, NG</span></div>
            <div className="setting-row"><span>Delivery</span><span>All Africa 🌍</span></div>
            <div className="setting-row"><span>Version</span><span>GS Africa React v8.1 SEO</span></div>
          </div>
          <button className="btn btn-dark" style={{width:'100%',marginTop:10}} onClick={()=>setModal(null)}>Close Settings</button>
        </div></div>
      )}

      {modal==='auth'&&(
        <div className="modal"><div className="modal-box"><h3>Login - GREEN STORE AFRICA</h3><input placeholder="Email" value={auth.email} onChange={e=>setAuth({...auth,email:e.target.value})} /><input placeholder="Password" type="password" value={auth.password} onChange={e=>setAuth({...auth,password:e.target.value})} /><button className="btn btn-gold" style={{width:'100%',marginTop:6}} onClick={async()=>{const {data,error}=await supabase.auth.signInWithPassword({email:auth.email,password:auth.password}); if(error) setAuth({...auth,msg:error.message}); else{setUser(data.user); setModal(null); const {data:w}=await supabase.from('wallets').select('balance').eq('user_id',data.user.id).single(); if(w)setWallet(w.balance)}}}>Login Africa</button><button className="btn btn-dark" style={{width:'100%',marginTop:6}} onClick={async()=>{const {data,error}=await supabase.auth.signUp({email:auth.email,password:auth.password}); if(error) setAuth({...auth,msg:error.message}); else{await supabase.from('wallets').insert({user_id:data.user.id,balance:500}); setWallet(500); setAuth({...auth,msg:'Created #500 - Welcome to GS Africa!'})}}}>Signup Africa + #500</button><div style={{fontSize:11,color:'var(--gold)'}}>{auth.msg}</div><button className="btn btn-dark" style={{width:'100%',marginTop:10}} onClick={()=>setModal(null)}>Close</button></div></div>
      )}

      {modal==='wallet'&&(
        <div className="modal"><div className="modal-box"><h3>Wallet #{wallet} - GREEN STORE AFRICA</h3><div style={{background:'var(--input)',border:'1px dashed var(--gold)',borderRadius:12,padding:10,marginTop:8}}><h2 style={{color:'var(--gold)'}}>9122857147</h2><p>PalmPay - Barnabas Paul - GS AFRICA</p></div><input placeholder="Amount" type="number" value={fund.amount} onChange={e=>setFund({...fund,amount:e.target.value})} /><input placeholder="Ref" value={fund.ref} onChange={e=>setFund({...fund,ref:e.target.value})} /><button className="btn btn-gold" style={{width:'100%'}} onClick={async()=>{if(!user) return alert('Login Africa first'); const {error}=await supabase.from('fundings').insert({user_id:user.id,amount:+fund.amount,monnify_ref:fund.ref,status:'pending'}); if(error) alert(error.message); else{alert('Submitted to GS Africa!'); setModal(null)}}}>I HAVE PAID - GS AFRICA</button><button className="btn btn-dark" style={{width:'100%',marginTop:10}} onClick={()=>setModal(null)}>Close</button></div></div>
      )}

      {modal==='cats'&&(
        <div className="modal"><div className="modal-box"><h3>Categories - GREEN STORE AFRICA 🌍</h3><div style={{display:'flex',flexWrap:'wrap',gap:6,marginTop:10}}>{CATS.map(c=><button key={c} className="btn btn-dark" style={{margin:4}} onClick={()=>{loadProducts(c); setModal(null)}}>{c} - Africa</button>)}</div><button className="btn btn-dark" style={{width:'100%',marginTop:10}} onClick={()=>setModal(null)}>Close</button></div></div>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
