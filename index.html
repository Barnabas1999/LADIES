<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>GREEN STORE AFRICA 🌍 </title>
<meta name="description" content="GREEN STORE AFRICA - All Africa mall. Tablets, Phones, Fashion, Electronics, Food, Medical. Wallet pay PalmPay 9122857147. Waybill GS-AFRICA tracking.">
<meta name="keywords" content="GREEN STORE AFRICA, Online shopping">
<link rel="canonical" href="https://green-store-lyart.vercel.app/">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#FF6A00">
<meta property="og:title" content="GREEN STORE AFRICA 🌍">
<meta property="og:description" content="Shopping for Africa - All categories">
<meta property="og:url" content="https://green-store-lyart.vercel.app/">
<meta property="og:image" content="https://green-store-lyart.vercel.app/og-image.png">

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.min.js"></script>
<link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#f2f2f2;font-family:Inter,system-ui;color:#222}
.ali-header{position:sticky;top:0;z-index:100;background:#fff;padding:8px 3%;display:flex;align-items:center;gap:8px;border-bottom:1px solid #eee}
.ali-logo{color:#FF6A00;font-weight:900;font-size:18px;letter-spacing:-0.5px}
.ali-search{flex:1;background:#f2f2f2;border-radius:999px;padding:9px 12px;display:flex;align-items:center;gap:6px}
.ali-search input{border:none;background:transparent;flex:1;outline:none;font-size:12px}
.ali-tabs{display:flex;gap:16px;padding:10px 3%;background:#fff;font-size:13px;border-bottom:1px solid #eee;overflow-x:auto;white-space:nowrap}
.ali-tabs b{border-bottom:2.5px solid #111;padding-bottom:6px}
.ali-filters{display:flex;gap:7px;padding:8px 3%;overflow-x:auto;background:#fff}
.ali-chip{border:1px solid #ddd;border-radius:999px;padding:6px 12px;font-size:11px;white-space:nowrap;background:#fff}
.ali-chip.black{background:#111;color:#fff;border-color:#111}
.ali-supplier{background:#fff;padding:10px 3%;display:flex;gap:8px;align-items:center;border-top:6px solid #f2f2f2}
.ali-supplier img{width:36px;height:36px;border-radius:6px;object-fit:cover}
.ali-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:#e5e5e5}
.ali-card{background:#fff;padding:6px;cursor:pointer}
.ali-card img{width:100%;height:108px;object-fit:cover;background:#fafafa}
.ali-price{font-weight:800;font-size:12px;margin-top:3px}
.ali-bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #eee;display:flex;justify-content:space-around;padding:6px 0 8px;z-index:500}
.ali-bottom div{text-align:center;font-size:10px;color:#666;line-height:1.1}
.ali-bottom div.active{color:#FF6A00}
.badge{background:#FF6A00;color:#fff;border-radius:999px;padding:1px 5px;font-size:9px;position:absolute;top:-4px;right:10px}
.cart-drawer{position:fixed;bottom:58px;left:0;right:0;background:#fff;border-radius:16px 16px 0 0;max-height:70vh;overflow:auto;z-index:600;box-shadow:0 -4px 20px rgba(0,0,0,.2);padding:12px}
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const {useState,useEffect}=React;
const supabaseClient=window.supabase.createClient('https://lmlivfvwhjkfxiukdrlm.supabase.co','sb_publishable_8Lhp0kpFsJM6Wrq_ZxKwgQ_YDrxBUaE');

function App(){
 const [products,setProducts]=useState([]);
 const [search,setSearch]=useState('tablet for adults');
 const [cart,setCart]=useState(JSON.parse(localStorage.getItem('gs-cart')||'[]'));
 const [showCart,setShowCart]=useState(false);
 const [wallet,setWallet]=useState(Number(localStorage.getItem('gs-wallet')||'0'));

 useEffect(()=>{ supabaseClient.from('products').select('*').limit(60).then(({data})=>setProducts(data||[])); },[]);
 useEffect(()=>{ localStorage.setItem('gs-cart',JSON.stringify(cart)); },[cart]);

 const addCart=(p)=>{ setCart(c=>{ const f=c.find(x=>x.id===p.id); if(f) return c.map(x=>x.id===p.id?{...x,qty:x.qty+1}:x); return [...c,{...p,qty:1}]; }); setShowCart(true); };
 const total=cart.reduce((s,i)=>s+i.price*i.qty,0);

 return (<div style={{paddingBottom:70}}>
  <div className="ali-header">
    <div className="ali-logo">GS AFRICA</div>
    <div className="ali-search"><i className="ri-search-line"></i><input value={search} onChange={e=>setSearch(e.target.value)} placeholder="What are you looking for?"/><i className="ri-camera-line" style={{fontSize:18}}></i><div style={{background:'#111',color:'#fff',borderRadius:'50%',width:26,height:26,display:'flex',alignItems:'center',justifyContent:'center'}}><i className="ri-search-line"></i></div></div>
  </div>

  <div className="ali-tabs"><span>AI Mode</span><b>Products</b><span>Manufacturers</span><span>Worldwide</span><span>GS Pay</span></div>

  <div className="ali-filters">
    <div className="ali-chip black">Low MOQ for customization</div>
    <div className="ali-chip">Sample-based customization</div>
    <div className="ali-chip">Fast customizing ⚡</div>
    <div className="ali-chip">Top Ranking 🏆</div>
    <div className="ali-chip">PalmPay 9122857147</div>
  </div>

  <div className="ali-supplier">
    <img src="https://via.placeholder.com/36/0c1f0f/C6A86F?text=GS"/>
    <div><b style={{fontSize:12}}>GREEN STORE AFRICA Co., Ltd.</b><div style={{fontSize:10}}><span style={{color:'#1686D7',fontWeight:700}}>✔ Verified</span> 3 yrs • 30+ staff • 7,100 m² • ₦860.5M+<br/>Response ≤2h • On-time 96% • Wallet Balance: ₦{wallet.toLocaleString()} • Waybill GS-AFRICA</div></div>
  </div>

  <div className="ali-grid">
    {products.filter(p=> (p.name||'').toLowerCase().includes(search.toLowerCase())).map((p,i)=>
      <div key={p.id||i} className="ali-card" onClick={()=>addCart(p)}>
        <img src={(p.image||'').split(',')[0]||'https://via.placeholder.com/200?text=GS+AFRICA'} alt={p.name}/>
        <div className="ali-price">₦{Number(p.price||0).toLocaleString()}</div>
        <div style={{fontSize:9,color:'#666',height:22,overflow:'hidden'}}>{p.name}</div>
        <div style={{fontSize:8,color:'#999'}}>Min. order: 1 piece • GS Wallet Pay</div>
      </div>
    )}
  </div>

  <div style={{background:'#fff',padding:'12px 3%',marginTop:6}}>
    <b style={{fontSize:13}}>Discover Reputable Suppliers</b>
    <p style={{fontSize:11,color:'#666',marginTop:4}}>GREEN STORE AFRICA - All Africa Online Mall - Port Harcourt | Ghana | Kenya | South Africa. Pay with GS Wallet (PalmPay 9122857147). Track with Waybill GS-AFRICA-xxxx. Alibaba-style shopping but for Africa.</p>
  </div>

  {showCart && <div className="cart-drawer">
    <div style={{display:'flex',justifyContent:'space-between'}}><b>Cart ({cart.length})</b><span onClick={()=>setShowCart(false)}>✕ Close</span></div>
    {cart.map(c=><div key={c.id} style={{display:'flex',justifyContent:'space-between',padding:'8px 0',borderBottom:'1px solid #eee'}}><span style={{fontSize:12}}>{c.name.slice(0,30)} x{c.qty}</span><b style={{fontSize:12}}>₦{(c.price*c.qty).toLocaleString()}</b></div>)}
    <div style={{display:'flex',justifyContent:'space-between',marginTop:10}}><b>Total: ₦{total.toLocaleString()}</b><button onClick={()=>{ if(wallet>=total){ setWallet(w=>w-total); localStorage.setItem('gs-wallet',(wallet-total).toString()); alert('Order placed! Waybill: GS-AFRICA-'+Date.now()); setCart([]); }else{ alert('Low wallet! Fund PalmPay 9122857147 then Top-up in wallet page. Total: ₦'+total.toLocaleString()); } }} style={{background:'#FF6A00',color:'#fff',border:'none',padding:'10px 18px',borderRadius:999}}>Pay with GS Wallet</button></div>
    <div style={{fontSize:10,color:'#666',marginTop:6}}>Wallet Pay: Send to PalmPay 9122857147 - Barnabas then Top-up. Waybill tracking GS-AFRICA-xxxx</div>
  </div>}

  <div className="ali-bottom">
    <div className="active"><i className="ri-home-5-fill" style={{fontSize:20}}></i><br/>Home</div>
    <div><i className="ri-apps-2-line" style={{fontSize:20}}></i><br/>Categories</div>
    <div><i className="ri-message-3-line" style={{fontSize:20}}></i><br/>Messenger</div>
    <div onClick={()=>setShowCart(true)} style={{position:'relative'}}><i className="ri-shopping-cart-line" style={{fontSize:20}}></i>{cart.length>0&&<span className="badge">{cart.length}</span>}<br/>Cart</div>
    <div><i className="ri-user-3-line" style={{fontSize:20}}></i><br/>My GS</div>
  </div>
 </div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>

<script>
// PWA Register - Makes GS AFRICA installable like Alibaba App
if('serviceWorker' in navigator){ navigator.serviceWorker.register('/sw.js').then(()=>console.log('GS AFRICA PWA Ready')); }
</script>
</body>
</html>
